<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Speech → TXT</title>
  <style>
    body { font-family: system-ui, Arial; max-width: 720px; margin: 2rem auto; padding: 1rem; }
    button, select { padding: 0.6rem 1rem; margin-right: 0.5rem; }
    #transcript { white-space: pre-wrap; border: 1px solid #ddd; padding: 1rem; min-height: 150px; margin-top: 1rem; }
    .status { margin-top: .5rem; color: #666; }
  </style>
</head>
<body>
  <h1>Lecture Summarizer</h1>

  <div style="margin-top:1rem;">
    <label for="lectureName"><b>Lecture Name:</b></label><br>
    <input
      type="text"
      id="lectureName"
      placeholder="e.g. Probability_Bayes_Theorem"
      style="width:100%; padding:0.6rem; margin-top:0.3rem;"
    />
    <div class="status" id="lectureError" style="color:red;"></div>
  </div>


  <!-- Language Selector -->
  <label for="langSelect"><b>Language:</b></label>
  <select id="langSelect">
    <option value="en-US">English (US)</option>
    <option value="en-IN">English (India)</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
    <option value="ta-IN">Tamil</option>
    <option value="kn-IN">Kannada</option>
    <option value="mr-IN">Marathi</option>
    <option value="te-IN">Telugu</option>
  </select>

  <div style="margin-top: 1rem;">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="downloadTranscriptBtn" disabled>Download Transcript</button>
    <button id="summarizeBtn" disabled>Summarize</button>
    <button id="downloadSummaryBtn" disabled>Download Summary</button>
  </div>

  <div class="status" id="status">Status: idle</div>

  <div id="transcript" contenteditable="true"></div>

  <h2>Summary</h2>
  <div id="summary" style="white-space: pre-wrap; border:1px solid #ddd; padding:1rem;"></div>


  <script>
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const support = !!Recognition;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadTranscriptBtn = document.getElementById('downloadTranscriptBtn');
    const downloadSummaryBtn = document.getElementById('downloadSummaryBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const langSelect = document.getElementById('langSelect');
    const lectureNameInput = document.getElementById("lectureName");
    const lectureError = document.getElementById("lectureError");

    downloadSummaryBtn.disabled = true;

    if (!support) {
      statusEl.innerText = "Web Speech API not supported. Use Chrome/Edge.";
    }

    let recog = support ? new Recognition() : null;

    function applyLanguage() {
      if (recog) {
        recog.lang = langSelect.value;
        console.log("Language set:", recog.lang);
      }
    }

    function isValidFilename(name) {
      // Windows + cross-platform safe
      const invalidChars = /[<>:"/\\|?*\x00-\x1F]/;
      return !invalidChars.test(name);
    }

    if (recog) {
      recog.continuous = true;
      recog.interimResults = true;

      applyLanguage(); // initial

      recog.onstart = () => { statusEl.innerText = 'Status: listening...'; };
      recog.onend = () => {
        statusEl.innerText = 'Status: stopped';
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };
      recog.onerror = (e) => { statusEl.innerText = 'Error: ' + e.error; };

      recog.onresult = (ev) => {
        let final = '';
        let interim = '';
        for (let i = 0; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        transcriptEl.innerText = (final + (interim ? "\n\n[partial]\n" + interim : "")).trim();
        downloadTranscriptBtn.disabled = transcriptEl.innerText.trim().length === 0;
      };
    }

    // Change language immediately
    langSelect.addEventListener('change', () => {
      applyLanguage();
      if (recog) try { recog.stop(); } catch {}
    });

    startBtn.onclick = () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      applyLanguage();
      try { recog.start(); } catch {}
    };

    stopBtn.onclick = () => {
      recog.stop();
    };

    downloadTranscriptBtn.onclick = () => {
      const lectureName = lectureNameInput.value.trim();
      if (!lectureName || !isValidFilename(lectureName)) return;

      const text = transcriptEl.innerText.trim();
      if (!text) return;

      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${lectureName}_transcript.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    downloadSummaryBtn.onclick = () => {
      const lectureName = lectureNameInput.value.trim();
      if (!lectureName || !isValidFilename(lectureName)) return;

      const summary = summaryEl.innerText.trim();
      if (!summary) return;

      const blob = new Blob([summary], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${lectureName}_summary.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };



    const summarizeBtn = document.getElementById("summarizeBtn");
    const summaryEl = document.getElementById("summary");

    function updateButtons() {
      const hasText = transcriptEl.innerText.trim().length > 0;
      downloadTranscriptBtn.disabled = !hasText;
      summarizeBtn.disabled = !hasText;
    }

    // modify your onresult handler slightly
    // after transcriptEl.innerText = ...
    updateButtons();

    summarizeBtn.onclick = async () => {
      lectureError.innerText = "";

      const lectureName = lectureNameInput.value.trim();
      if (!lectureName) {
        lectureError.innerText = "Lecture name is required.";
        return;
      }

      if (!isValidFilename(lectureName)) {
        lectureError.innerText =
          "Lecture name contains invalid characters for a file name.";
        return;
      }

      const transcript = transcriptEl.innerText.trim();
      if (!transcript) {
        lectureError.innerText = "Transcript is empty.";
        return;
      }

      summaryEl.innerText = "Summarizing...";

      try {
        const res = await fetch("http://127.0.0.1:8000/v1/summarize", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            transcript: transcript,
            options: {
              length: "short",
              format: "bullets",
              include_timestamps: false,
              extract_qna: false,
              extract_actions: false,
              speakers_as_sections: false
            }
          })
        });

        if (!res.ok) {
          throw new Error("Backend error");
        }

        const data = await res.json();
        summaryEl.innerText = data.summary_text;
        downloadSummaryBtn.disabled = false;

      } catch (err) {
        summaryEl.innerText = "Error connecting to backend.";
        console.error(err);
      }
    };


  </script>
</body>
</html>
