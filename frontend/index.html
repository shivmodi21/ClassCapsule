<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Class Capsule</title>
  <style>
    body { font-family: system-ui, Arial; max-width: 720px; margin: 2rem auto; padding: 1rem; }
    button, select { padding: 0.6rem 1rem; margin-right: 0.5rem; }
    #transcript { white-space: pre-wrap; border: 1px solid #ddd; padding: 1rem; min-height: 150px; margin-top: 1rem; }
    .status { margin-top: .5rem; color: #666; }
  </style>
</head>
<body>
  <h1>Lecture Summarizer</h1>

  <div style="margin-top:1rem;">
    <label for="lectureName"><b>Lecture Name:</b></label><br>
    <input
      type="text"
      id="lectureName"
      placeholder="e.g. Probability_Bayes_Theorem"
      style="width:100%; padding:0.6rem; margin-top:0.3rem;"
    />
    <div class="status" id="lectureError" style="color:red;"></div>
  </div>

  <h3>Upload Lecture Audio</h3>

  <input
    type="file"
    id="audioFileInput"
    accept="audio/*"
  />
  <button id="uploadAudioBtn">Upload & Transcribe</button>

  <div class="status" id="audioStatus"></div>
  <div class="status" id="detectedLanguage"></div>

  <hr style="margin:1.5rem 0;">

  <!-- Language Selector -->
  <label for="langSelect"><b>Language:</b></label>
  <select id="langSelect">
    <option value="en-US">English (US)</option>
    <option value="en-IN">English (India)</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
    <option value="ta-IN">Tamil</option>
    <option value="kn-IN">Kannada</option>
    <option value="mr-IN">Marathi</option>
    <option value="te-IN">Telugu</option>
  </select>

  <div style="margin-top: 1rem;">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="clearBtn">Clear & New Lecture</button>
  </div>

  <div class="status" id="status">Status: IDLE</div>

  <div id="transcript" contenteditable="true"></div>
  
  <div style="margin-top: 1rem;">
    <button id="downloadTranscriptBtn" disabled>Download Transcript</button>
    <button id="summarizeBtn" disabled>Summarize</button>
    <button id="downloadSummaryBtn" disabled>Download Summary</button>
  </div>

  <h2 id="summaryTitle">Summary</h2>
  <div id="summary" style="white-space: pre-wrap; border:1px solid #ddd; padding:1rem;"></div>


  <script>
    let inputMode = null; // "live" or "upload"
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const support = !!Recognition;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadTranscriptBtn = document.getElementById('downloadTranscriptBtn');
    const downloadSummaryBtn = document.getElementById('downloadSummaryBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const langSelect = document.getElementById('langSelect');
    const lectureNameInput = document.getElementById("lectureName");
    const lectureError = document.getElementById("lectureError");
    const summarizeBtn = document.getElementById("summarizeBtn");
    const summaryEl = document.getElementById("summary");

    const audioFileInput = document.getElementById("audioFileInput");
    const uploadAudioBtn = document.getElementById("uploadAudioBtn");
    const audioStatus = document.getElementById("audioStatus");
    const detectedLanguageEl = document.getElementById("detectedLanguage");

    const clearBtn = document.getElementById("clearBtn");


    downloadSummaryBtn.disabled = true;

    if (!support) {
      statusEl.innerText = "Web Speech API not supported. Use Chrome/Edge.";
    }

    let recog = support ? new Recognition() : null;

    function applyLanguage() {
      if (recog) {
        recog.lang = langSelect.value;
        console.log("Language set:", recog.lang);
      }
    }

    function isValidFilename(name) {
      // Windows + cross-platform safe
      const invalidChars = /[<>:"/\\|?*\x00-\x1F]/;
      return !invalidChars.test(name);
    }

    function updateButtons() {
      const hasText = transcriptEl.innerText.trim().length > 0;
      downloadTranscriptBtn.disabled = !hasText;
      summarizeBtn.disabled = !hasText;
    }

    function enableLiveRecordingMode() {
      inputMode = "live";

      // disable audio upload
      audioFileInput.disabled = true;
      uploadAudioBtn.disabled = true;

      audioStatus.innerText = "Audio upload disabled while recording.";
    }

    function enableAudioUploadMode() {
      inputMode = "audio";

      // disable live recording
      startBtn.disabled = true;
      stopBtn.disabled = true;

      statusEl.innerText = "Live recording disabled while using audio upload.";
    }

    function resetInputModes() {
      inputMode = null;

      // enable everything
      audioFileInput.disabled = false;
      uploadAudioBtn.disabled = false;

      startBtn.disabled = false;
      stopBtn.disabled = true;

      audioStatus.innerText = "";
      statusEl.innerText = "Status: IDLE";
    }

    function resetLecture() {
      // Clear text areas
      transcriptEl.innerText = "";
      summaryEl.innerText = "";

      // Clear inputs
      lectureNameInput.value = "";
      audioFileInput.value = "";

      // Reset statuses
      statusEl.innerText = "Status: IDLE";
      audioStatus.innerText = "";
      lectureError.innerText = "";

      // Reset buttons
      downloadTranscriptBtn.disabled = true;
      downloadSummaryBtn.disabled = true;
      summarizeBtn.disabled = true;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      // Reset input modes
      resetInputModes();
    }

    transcriptEl.addEventListener("input", () => {
      resetInputModes();
      updateButtons();
    });


    if (recog) {
      recog.continuous = true;
      recog.interimResults = true;

      applyLanguage(); // initial

      recog.onstart = () => { statusEl.innerText = 'Status: listening...'; };
      recog.onend = () => {
        statusEl.innerText = 'Status: stopped';
        startBtn.disabled = false;
        stopBtn.disabled = true;

        resetInputModes();
      };
      recog.onerror = (e) => { statusEl.innerText = 'Error: ' + e.error; };

      recog.onresult = (ev) => {
        let final = '';
        let interim = '';
        for (let i = 0; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) final += r[0].transcript;
          else interim += r[0].transcript;
        }
        transcriptEl.innerText = (final + (interim ? "\n\n[partial]\n" + interim : "")).trim();
        updateButtons();
        downloadTranscriptBtn.disabled = transcriptEl.innerText.trim().length === 0;
      };
    }

    // Change language immediately
    langSelect.addEventListener('change', () => {
      applyLanguage();
      if (recog) try { recog.stop(); } catch {}
    });

    audioFileInput.addEventListener("change", () => {
      audioStatus.innerText = "";
    });
    
    startBtn.onclick = () => {
      enableLiveRecordingMode();

      startBtn.disabled = true;
      stopBtn.disabled = false;
      applyLanguage();
      try { recog.start(); } catch {}
    };

    stopBtn.onclick = () => {
      recog.stop();
    };

    clearBtn.onclick = () => {
      if (confirm("Clear current lecture and start a new one?")) {
        resetLecture();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };

    uploadAudioBtn.onclick = async () => {
      if (inputMode === "live") {
        audioStatus.innerText = "Stop live recording before uploading audio.";
        return;
      }
      const file = audioFileInput.files[0];
      if (!file) {
        audioStatus.innerText = "Please select an audio file.";
        return;
      }

      enableAudioUploadMode();
      audioStatus.innerText = "Uploading & transcribing… this may take 1–2 minutes.";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("http://127.0.0.1:8000/v1/transcribe", {
          method: "POST",
          body: formData
        });

        if (!res.ok) throw new Error("Transcription failed");

        const data = await res.json();

        transcriptEl.innerText = data.transcript;
        audioStatus.innerText = "Transcription complete.";

        if (data.language) {
          detectedLanguageEl.innerText = "Detected language: " + data.language.toUpperCase();
        }

        resetInputModes();
        updateButtons();

        // enable transcript-related buttons
        downloadTranscriptBtn.disabled = false;
        summarizeBtn.disabled = false;

      } catch (err) {
        console.error(err);
        audioStatus.innerText = "Error during transcription.";
      }
    };


    downloadTranscriptBtn.onclick = () => {
      const lectureName = lectureNameInput.value.trim();
      if (!lectureName || !isValidFilename(lectureName)) return;

      const text = transcriptEl.innerText.trim();
      if (!text) return;

      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${lectureName}_transcript.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    downloadSummaryBtn.onclick = () => {
      const lectureName = lectureNameInput.value.trim();
      if (!lectureName || !isValidFilename(lectureName)) return;

      const summary = summaryEl.innerText.trim();
      if (!summary) return;

      const blob = new Blob([summary], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${lectureName}_summary.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };



    summarizeBtn.onclick = async () => {
      lectureError.innerText = "";

      // disable summarize during processing
      summarizeBtn.disabled = true;
      downloadSummaryBtn.disabled = true;
      summaryEl.innerText = "Summarizing... please wait (this may take 1-3 minutes).";

      const lectureName = lectureNameInput.value.trim();
      if (!lectureName) {
        lectureError.innerText = "Lecture name is required.";
        return;
      }

      if (!isValidFilename(lectureName)) {
        lectureError.innerText =
          "Lecture name contains invalid characters for a file name.";
        return;
      }

      const transcript = transcriptEl.innerText.trim();
      if (!transcript) {
        lectureError.innerText = "Transcript is empty.";
        return;
      }

      summaryEl.innerText = "Summarizing...";

      try {
        const res = await fetch("http://127.0.0.1:8000/v1/summarize", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            transcript: transcript,
            options: {
              length: "short",
              format: "bullets",
              include_timestamps: false,
              extract_qna: false,
              extract_actions: false,
              speakers_as_sections: false
            }
          })
        });

        if (!res.ok) {
          throw new Error("Backend error");
        }

        const data = await res.json();
        summaryEl.innerText = data.summary_text;

        // enable buttons again
        downloadSummaryBtn.disabled = false;
        summarizeBtn.disabled = false;

        document.getElementById("summaryTitle").scrollIntoView({ behavior: "smooth" });

      } catch (err) {
        summaryEl.innerText = "Error connecting to backend.";
        console.error(err);

        // re-enable summarize so user can retry
        summarizeBtn.disabled = false;
      }
    };


  </script>
</body>
</html>
