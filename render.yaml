services:
  - type: web
    name: Class Capsule
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
